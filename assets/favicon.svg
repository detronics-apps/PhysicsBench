<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The Detronics ground: navy, full bleed, rx 12. Identical in every app. -->
  <rect width="64" height="64" rx="12" fill="#1f2d3d"/>

  <!-- The subject: a ball on a trajectory, with the force that bends it.
       Drawn in flat shapes so it survives being 16 px wide in a tab. -->

  <!-- The arc it has travelled, as a dotted trail. -->
  <circle cx="11" cy="41" r="1.8" fill="#7fabc7" opacity="0.45"/>
  <circle cx="16" cy="33" r="1.8" fill="#7fabc7" opacity="0.55"/>
  <circle cx="22" cy="28" r="1.8" fill="#7fabc7" opacity="0.7"/>
  <circle cx="29" cy="25" r="1.8" fill="#7fabc7" opacity="0.85"/>

  <!-- The ball, at the top of its arc. -->
  <circle cx="38" cy="24" r="7.5" fill="#e0a458"/>

  <!-- The force acting on it: straight down, apex on the tip. -->
  <rect x="36.5" y="33" width="3" height="13" rx="1.5" fill="#7fabc7"/>
  <path d="M 32.5 44 L 38 51 L 43.5 44 Z" fill="#7fabc7"/>

  <!-- The ground it is heading for. -->
  <rect x="8" y="55" width="48" height="3" rx="1.5" fill="#cdd1d2" opacity="0.55"/>
</svg>
